<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolSmithAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }

    textarea, input[type="text"] {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      font-family: inherit;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: #6366f1;
    }

    input[type="text"] {
      font-family: monospace;
      letter-spacing: 0.03em;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }

    #btn-run {
      background: #6366f1;
      color: #fff;
    }

    #btn-health {
      background: #1e2130;
      color: #94a3b8;
      border: 1px solid #2d3148;
    }

    .result-box {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 14px 16px;
      min-height: 80px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #64748b;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <h1>ToolSmithAI</h1>
    <p>Natural language task interpreter</p>
  </header>

  <div class="card">

    <label>
      Task input
      <textarea id="task-input" placeholder="e.g. Email me a weekly report"></textarea>
    </label>

    <label>
      API key
      <input type="text" id="api-key" placeholder="tsm_your_api_key_here" />
    </label>

    <div class="actions">
      <button id="btn-run">Run Task</button>
      <button id="btn-health">Check API Health</button>
    </div>

    <div class="result-box" id="result">Results will appear here...</div>

  </div>

  <script>
    const result = document.getElementById('result');

    document.getElementById('btn-health').addEventListener('click', async () => {
      result.textContent = 'Checking API health...';
      try {
        const res = await fetch('https://toolsmithai.onrender.com/v1/health');
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: Could not reach the API.\n' + err.message;
      }
    });

    document.getElementById('btn-run').addEventListener('click', async () => {
      const input = document.getElementById('task-input').value.trim();
      const apiKey = document.getElementById('api-key').value.trim();

      if (!input) {
        result.textContent = 'Error: Task input cannot be empty.';
        return;
      }
      if (!apiKey) {
        result.textContent = 'Error: API key cannot be empty.';
        return;
      }

      result.textContent = 'Running task...';
      try {
        const res = await fetch('https://toolsmithai.onrender.com/v1/interpret', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
          },
          body: JSON.stringify({ input }),
        });
        const data = await res.json();
        if (!res.ok) {
          result.textContent = 'Error ' + res.status + ': ' + (data.message || data.detail || JSON.stringify(data));
          return;
        }
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: Could not reach the API.\n' + err.message;
      }
    });
  </script>

</body>
</html>
